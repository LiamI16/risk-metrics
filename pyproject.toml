[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-metrics"
version = "0.1.0"
description = "CPA metrics and velocity obstacles for convex agents under position and velocity uncertainty"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Liam Imagawa", email = "liamimagawa@gmail.com" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["risk_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# numpy's multivariate_normal emits spurious matmul RuntimeWarnings on macOS Accelerate builds.
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
